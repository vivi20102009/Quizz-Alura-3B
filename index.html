<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Você é Aventureiro(a) ou Tranquilo(a)?</title>
</head>
<body>

    <div class="caixa-principal">

        <h1>Você é Aventureiro(a) ou Tranquilo(a)?</h1>

        <!-- Página inicial -->
        <div class="pagina-inicial">
            <p>Descubra se você é uma pessoa aventureira ou tranquila!</p>
            <p>Responda às perguntas e descubra seu resultado.</p>

            <button id="botao-comecar">Começar</button>
        </div>

        <!-- Nome do jogador -->
        <p class="nome-jogador"></p>

        <!-- Perguntas -->
        <div class="caixa-perguntas"></div>

        <!-- Alternativas -->
        <div class="caixa-alternativas"></div>

        <!-- Resultado -->
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
        </div>

    </div>

    <script src="script.js"></script>

</html>
