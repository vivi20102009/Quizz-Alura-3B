<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Você é Aventureiro(a) ou Tranquilo(a)?</title>
</head>
<body>

    <div class="caixa-principal">

        <!-- Página inicial -->
        <div class="pagina-inicial">

            <div class="icone-inicial">✦</div>

            <h1>Você é Aventureiro(a) ou Tranquilo(a)?</h1>

            <p class="descricao">
                Descubra qual personalidade combina mais com você!
            </p>

            <p class="instrucoes">
                Responda às perguntas e descubra seu resultado.
            </p>

            <button id="botao-comecar">Começar</button>

        </div>

        <!-- Área do quiz -->
        <div class="pagina-quiz">

            <p class="nome-jogador"></p>

            <div class="progresso"></div>

            <div class="caixa-perguntas"></div>

            <div class="caixa-alternativas"></div>

            <div class="caixa-resultado">
                <p class="texto-resultado"></p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
